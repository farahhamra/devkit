[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "electroerp-devkit"
version = "0.12.1"
description = "Project-aware code discovery for ElectroERP and coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pathspec>=0.12.1,<1",
  "PyYAML>=6.0.2,<7",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "ast-grep-cli>=0.50,<0.51"]
query = ["ast-grep-cli>=0.50,<0.51"]

[project.scripts]
devkit = "devkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit"]

[tool.hatch.build.targets.wheel.force-include]
"docs/agents/devkit-rules.md" = "devkit/agent_templates/devkit-rules.md"
"docs/agents/SKILL.md" = "devkit/agent_templates/SKILL.md"
"docs/agents/AGENTS.fragment.md" = "devkit/agent_templates/AGENTS.fragment.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
